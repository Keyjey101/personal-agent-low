services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    # наружу не торчит: только nginx на этом же хосте.
    # Текущий конфиг gmyrya.com: location / → 3000, location /api/ → 3001.
    # Оба хост-порта ведут в один контейнер, поэтому nginx менять не нужно.
    ports:
      - "127.0.0.1:3000:8080"
      - "127.0.0.1:3001:8080"
    mem_limit: 450m
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
