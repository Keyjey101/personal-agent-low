<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F3EE" />
  <meta name="description" content="Диспетчер — личный пункт управления делами: одно следующее действие, учёт состояния, проактивный агент." />
  <title>Диспетчер</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='14' width='4' height='7' rx='1.5' fill='%23D0623D'/%3E%3Crect x='10' y='8' width='4' height='13' rx='1.5' fill='%234A90B8'/%3E%3Crect x='17' y='3' width='4' height='18' rx='1.5' fill='%232F8F6B'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a class="skip-link" href="#content">Перейти к содержимому</a>

  <!-- Логин: показывается до авторизации -->
  <section id="login" class="login" hidden>
    <div class="login-card mm" role="main" aria-label="Вход в Диспетчер">
      <div class="login-brand">
        <svg class="login-mark" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="14" width="4" height="7" rx="1.5" fill="var(--a-kitchen)" />
          <rect x="10" y="8" width="4" height="13" rx="1.5" fill="var(--a-massage)" />
          <rect x="17" y="3" width="4" height="18" rx="1.5" fill="var(--a-fitness)" />
        </svg>
        <h1 class="login-title">Диспетчер</h1>
        <p class="login-sub">личный пункт управления</p>
      </div>
      <form id="loginForm" novalidate>
        <label class="field">
          <span class="field-label">Пароль</span>
          <input id="loginPassword" type="password" name="password" autocomplete="current-password" required />
        </label>
        <div id="loginError" class="field-error" role="alert" hidden></div>
        <button class="btn btn--primary btn--block" id="loginSubmit" type="submit">Войти</button>
      </form>
    </div>
  </section>

  <!-- Каркас приложения -->
  <div id="app" hidden>
    <header class="mast">
      <a class="brand" href="#/today" aria-label="Диспетчер — на страницу «Сегодня»">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="14" width="4" height="7" rx="1.5" fill="var(--a-kitchen)" />
          <rect x="10" y="8" width="4" height="13" rx="1.5" fill="var(--a-massage)" />
          <rect x="17" y="3" width="4" height="18" rx="1.5" fill="var(--a-fitness)" />
        </svg>
        <span class="brand-name">Диспетчер</span>
      </a>
      <div class="mast-clock" id="mastClock" aria-hidden="true"></div>
      <div class="mast-side">
        <div class="mast-chips" id="mastChips"></div>
        <a class="mast-gear" href="#/settings" aria-label="Настройки" title="Настройки">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-settings" /></svg>
        </a>
      </div>
    </header>

    <nav class="tabs" id="tabs" aria-label="Разделы">
      <span class="tabs-ink" aria-hidden="true"></span>
      <a href="#/today" data-route="today">Сегодня</a>
      <a href="#/projects" data-route="projects">Проекты</a>
      <a href="#/tasks" data-route="tasks">Задачи</a>
      <a href="#/graph" data-route="graph">Граф</a>
      <a href="#/memory" data-route="memory">Память</a>
      <a href="#/activity" data-route="activity">Журнал</a>
    </nav>

    <main id="content" class="content" tabindex="-1"></main>

    <nav class="bottomnav" id="bottomNav" aria-label="Разделы">
      <a href="#/today" data-route="today"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sun" /></svg><span>Сегодня</span></a>
      <a href="#/tasks" data-route="tasks"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-checks" /></svg><span>Задачи</span></a>
      <a href="#/projects" data-route="projects"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-box" /></svg><span>Проекты</span></a>
      <button type="button" id="moreBtn" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-dots" /></svg><span>Ещё</span></button>
    </nav>

    <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Ещё разделы" hidden>
      <a href="#/graph" data-route="graph"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-graph" /></svg><span>Граф знаний</span></a>
      <a href="#/memory" data-route="memory"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-memory" /></svg><span>Память</span></a>
      <a href="#/activity" data-route="activity"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-pulse" /></svg><span>Журнал</span></a>
      <a href="#/settings" data-route="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-settings" /></svg><span>Настройки</span></a>
      <button type="button" data-action="logout"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-logout" /></svg><span>Выйти</span></button>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- Спрайт иконок: stroke 1.75, скруглённые концы, currentColor -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <defs>
      <g id="i-check" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></g>
      <g id="i-clock" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></g>
      <g id="i-plus" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14" /></g>
      <g id="i-bolt" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" /></g>
      <g id="i-hourglass" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10M7 21h10M8 3c0 4 3 5 4 6 1-1 4-2 4-6M8 21c0-4 3-5 4-6 1 1 4 2 4 6" /></g>
      <g id="i-settings" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h13M20 18h0" /><circle cx="16" cy="6" r="2" /><circle cx="10" cy="12" r="2" /><circle cx="18.5" cy="18" r="2" /></g>
      <g id="i-box" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5V8z" /><path d="M3 8l9 5 9-5M12 13v8" /></g>
      <g id="i-checks" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h11M10 12h11M10 18h11" /><path d="m3 6 1.5 1.5L7 5M3 17l1.5 1.5L7 15" /></g>
      <g id="i-graph" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5" /><circle cx="18" cy="8" r="2.5" /><circle cx="12" cy="18" r="2.5" /><path d="m8.3 7 7.3.8M7.4 8.2l3.3 7.6M16.6 10.2l-3.4 5.6" /></g>
      <g id="i-memory" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="5" rx="1.5" /><path d="M4 9v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9M4 15h16" /><path d="M10 4v5M14 4v5" /></g>
      <g id="i-pulse" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-7 4 14 2-7h6" /></g>
      <g id="i-logout" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3M16 17l5-5-5-5M21 12H9" /></g>
      <g id="i-warn" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 21h20L12 3zM12 10v5M12 18h.01" /></g>
      <g id="i-lock" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></g>
      <g id="i-chev" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></g>
      <g id="i-x" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12" /></g>
      <g id="i-undo" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5" /><path d="M4 9h10a6 6 0 0 1 0 12h-3" /></g>
      <g id="i-download" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 21h16" /></g>
      <g id="i-moon" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" /></g>
      <g id="i-sun" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></g>
      <g id="i-dots" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h.01M12 12h.01M19 12h.01" /></g>
      <g id="i-glass" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 15v6M5 3h14l-7 12L5 3z" /></g>
      <g id="i-zoom-in" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5M11 8v6M8 11h6" /></g>
      <g id="i-zoom-out" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5M8 11h6" /></g>
      <g id="i-target" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="4" /><path d="M12 3v3m0 12v3M3 12h3m12 0h3" /></g>
    </defs>
  </svg>

  <script defer src="./demo.js"></script>
  <script defer src="./app.js"></script>
</body>
</html>
